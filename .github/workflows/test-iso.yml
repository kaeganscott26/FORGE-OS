name: Build FORGE-OS test ISO

on:
  workflow_run:
    workflows: ["Verify FORGE-OS source contract"]
    types: [completed]

permissions:
  contents: write

env:
  TUIGREET_VERSION: "0.11.0"
  TUIGREET_COMMIT: "6fb15fffb794c6bd357164347d8b6d9e0aa92bbc"

concurrency:
  group: forge-os-test-iso-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build-test-iso:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the exact verified FORGE-OS commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: FORGE-OS
          fetch-depth: 1

      - name: Resolve immutable test inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < FORGE-OS/VERSION)"
          forge_ref="$(tr -d '[:space:]' < FORGE-OS/FORGE_REF)"
          source_sha="${{ github.event.workflow_run.head_sha }}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]] || {
            echo "Refusing to publish non-test VERSION through the test ISO workflow: $version" >&2
            exit 1
          }
          [[ "$forge_ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid FORGE_REF: $forge_ref" >&2; exit 1; }
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid verified source SHA: $source_sha" >&2; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "forge_ref=$forge_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          printf 'Building FORGE-OS %s from OS %s and FORGE %s\n' "$version" "$source_sha" "$forge_ref"

      - name: Refuse to overwrite an existing test provenance tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.inputs.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git -C FORGE-OS ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump VERSION instead of replacing a published test image." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump VERSION instead of replacing published provenance." >&2
            exit 1
          fi

      - name: Check out the exact pinned FORGE runtime source
        uses: actions/checkout@v7
        with:
          repository: kaeganscott26/FORGE
          ref: ${{ steps.inputs.outputs.forge_ref }}
          path: FORGE
          fetch-depth: 1

      - name: Verify both immutable checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C FORGE-OS rev-parse HEAD)" = "${{ steps.inputs.outputs.source_sha }}"
          test "$(git -C FORGE rev-parse HEAD)" = "${{ steps.inputs.outputs.forge_ref }}"
          test -z "$(git -C FORGE-OS status --porcelain)"
          test -z "$(git -C FORGE status --porcelain)"

      - name: Build FORGE runtime and ArchISO in privileged Arch Linux
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e TUIGREET_VERSION="$TUIGREET_VERSION" \
            -e TUIGREET_COMMIT="$TUIGREET_COMMIT" \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm \
                git nodejs-lts-jod npm python rust systemd desktop-file-utils \
                pacman-contrib greetd sudo archiso squashfs-tools libxcrypt-compat

              git config --global --add safe.directory /work/FORGE-OS
              git config --global --add safe.directory /work/FORGE
              test "$(git -C /work/FORGE-OS rev-parse HEAD)" = "${{ steps.inputs.outputs.source_sha }}"
              test "$(git -C /work/FORGE rev-parse HEAD)" = "${{ steps.inputs.outputs.forge_ref }}"

              git clone --branch "$TUIGREET_VERSION" --depth 1 https://github.com/tuigreet/tuigreet.git /tmp/tuigreet
              test "$(git -C /tmp/tuigreet rev-parse HEAD)" = "$TUIGREET_COMMIT"
              cargo build --locked --release --manifest-path /tmp/tuigreet/Cargo.toml -p tuigreet
              install -Dm755 /tmp/tuigreet/target/release/tuigreet /usr/local/bin/tuigreet
              install -d -m 0755 /usr/share/forge-os
              printf "repository=https://github.com/tuigreet/tuigreet.git\nversion=%s\ncommit=%s\n" \
                "$TUIGREET_VERSION" "$TUIGREET_COMMIT" > /usr/share/forge-os/tuigreet-source.env
              /usr/local/bin/tuigreet --version 2>&1 | grep -F "$TUIGREET_VERSION"
              /usr/local/bin/tuigreet --help 2>&1 | grep -F -- "--background"
              /usr/local/bin/tuigreet --help 2>&1 | grep -F -- "--kb-background"

              bash /work/FORGE-OS/scripts/build-forge.sh /work/FORGE
              bash /work/FORGE-OS/scripts/build-iso.sh
              chmod -R a+rX /work/FORGE-OS/build/iso
            '

      - name: Normalize and verify the single ISO artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.inputs.outputs.version }}"
          mapfile -t built_isos < <(find FORGE-OS/build/iso -maxdepth 1 -type f -name '*.iso' -print | sort)
          if (( ${#built_isos[@]} != 1 )); then
            printf 'Expected exactly one ISO, found %d:\n' "${#built_isos[@]}" >&2
            printf '  %s\n' "${built_isos[@]:-none}" >&2
            exit 1
          fi

          release_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$release_dir"
          iso_name="FORGE-OS-${version}-x86_64.iso"
          cp -- "${built_isos[0]}" "$release_dir/$iso_name"
          (
            cd "$release_dir"
            sha256sum "$iso_name" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          [[ -s "$release_dir/$iso_name" ]] || { echo 'Normalized ISO is empty.' >&2; exit 1; }
          [[ -s "$release_dir/SHA256SUMS" ]] || { echo 'SHA256SUMS is empty.' >&2; exit 1; }
          echo "iso_name=$iso_name" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$release_dir/$iso_name" "$release_dir/SHA256SUMS"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: FORGE-OS-${{ steps.inputs.outputs.version }}-test-iso
          path: |
            ${{ steps.artifact.outputs.release_dir }}/${{ steps.artifact.outputs.iso_name }}
            ${{ steps.artifact.outputs.release_dir }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub prerelease test ISO
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.inputs.outputs.tag }}
          VERSION: ${{ steps.inputs.outputs.version }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
          FORGE_SHA: ${{ steps.inputs.outputs.forge_ref }}
          ISO_NAME: ${{ steps.artifact.outputs.iso_name }}
          RELEASE_DIR: ${{ steps.artifact.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/forge-os-test-release.md"
          cat > "$notes" <<EOF
          # FORGE-OS $VERSION — test ISO

          **This is a prerelease test image, not a stable release.**

          Provenance:
          - FORGE-OS: \`$SOURCE_SHA\`
          - FORGE: \`$FORGE_SHA\`
          - canonical tuigreet: \`$TUIGREET_VERSION\` / \`$TUIGREET_COMMIT\`

          The source contract passed before this workflow was allowed to run. The image contains the canonical Wayland login path, Matrix/F4 greeter, automatic windowed Guided Setup under KWin, manual disk-partition boundary, first-boot service verification, Advanced administrator controls, recovery, and reversible checkpoint/runtime rollback.

          Verify \`$ISO_NAME\` against \`SHA256SUMS\` before writing it to USB. Physical boot/install testing is still required before any stable release.
          EOF

          gh release create "$TAG" \
            "$RELEASE_DIR/$ISO_NAME" \
            "$RELEASE_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "FORGE-OS $VERSION Test ISO" \
            --notes-file "$notes" \
            --prerelease

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.inputs.outputs.tag }}
          ISO_NAME: ${{ steps.artifact.outputs.iso_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName,targetCommitish,assets \
            --jq '. as $r | if ($r.isPrerelease == true and $r.tagName == env.TAG and ([.assets[].name] | index(env.ISO_NAME)) != null and ([.assets[].name] | index("SHA256SUMS")) != null) then $r else error("published release verification failed") end'
