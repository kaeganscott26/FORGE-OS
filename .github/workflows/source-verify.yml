name: Verify FORGE-OS source contract

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install validation dependencies
        run: |
          pacman -Syu --noconfirm git nodejs-lts-jod npm python rust systemd desktop-file-utils pacman-contrib greetd sudo
          sed -i '/^#\[multilib\]$/,/^#Include = \/etc\/pacman.d\/mirrorlist$/ { s/^#\[multilib\]$/[multilib]/; s|^#Include = /etc/pacman.d/mirrorlist$|Include = /etc/pacman.d/mirrorlist|; }' /etc/pacman.conf
          pacman -Sy --noconfirm
      - name: Build rolling maintained tuigreet fork
        run: |
          git clone --depth 1 https://github.com/NotAShelf/tuigreet.git /tmp/tuigreet
          cargo build --locked --release --manifest-path /tmp/tuigreet/Cargo.toml -p tuigreet
          install -Dm755 /tmp/tuigreet/target/release/tuigreet /usr/local/bin/tuigreet
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--background'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--kb-background'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--doom-height'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--matrix-length'
      - uses: actions/checkout@v7
        with:
          path: FORGE-OS
      - uses: actions/checkout@v7
        with:
          repository: kaeganscott26/FORGE
          path: FORGE
      - name: Install locked FORGE dependencies
        run: npm --prefix FORGE ci
      - name: Verify greeter package contract
        run: TUIGREET_BIN=/usr/local/bin/tuigreet bash ./FORGE-OS/tests/greeter-contract.sh
      - name: Verify complete source contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" TUIGREET_BIN=/usr/local/bin/tuigreet ./FORGE-OS/tests/source-verify.sh
