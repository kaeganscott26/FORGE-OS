[terminal]
vt = 1

[general]
source_profile = false

[default_session]
command = "tuigreet --issue --time --battery --remember --remember-session --asterisks --width 72 --custom-title 'FORGE-OS' --greeting 'FORGE owns the workspace' --theme border=green;text=white;prompt=green;time=cyan;action=green;button=green;container=black;input=white --background matrix --background-fps 30 --matrix-colors white,green,black --matrix-length 8,24 --matrix-speed 0.25,0.85 --kb-command 2 --kb-sessions 3 --kb-background 4 --kb-power 5 --power-shutdown 'systemctl poweroff' --power-reboot 'systemctl reboot' --sessions /usr/share/forge-os/wayland-sessions --xsessions /usr/share/forge-os/disabled-xsessions --no-xsession-wrapper --cmd 'startplasma-wayland forge-wayland-session forge-wayland-client'"
user = "greeter"
