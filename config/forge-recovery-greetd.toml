[terminal]
vt = 2

[general]
source_profile = false

[initial_session]
command = "/usr/local/bin/forge-recovery-session"
user = "@USER@"

[default_session]
command = "tuigreet --issue --time --width 72 --custom-title 'FORGE RECOVERY' --greeting 'Diagnostics are available before authentication; mutations require authorization' --theme border=green;text=white;prompt=green;time=cyan;action=green;button=green;container=black;input=white --cmd '/usr/local/bin/forge-recovery-session'"
user = "greeter"
