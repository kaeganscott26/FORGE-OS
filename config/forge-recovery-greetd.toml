[terminal]
vt = 2

[general]
source_profile = false

[initial_session]
command = "/usr/local/bin/forge-recovery-session"
user = "@USER@"

[default_session]
command = "/usr/local/bin/tuigreet --time --width 72 --greeting 'FORGE Recovery - diagnostics before mutation' --theme 'border=green;text=white;prompt=green;time=cyan;action=green;button=green;container=black;input=white' --cmd '/usr/local/bin/forge-recovery-session'"
user = "greeter"
